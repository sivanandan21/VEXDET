[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "workzone-vision"
version = "0.1.0"
description = "Edge-ready real-time object detection fine-tuning, active learning, hard-negative mining, and ONNX export pipeline powered by Apache-2.0 RF-DETR."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = [
  "computer-vision",
  "object-detection",
  "rf-detr",
  "active-learning",
  "onnx",
  "edge-ai",
  "pytorch",
  "video-analytics",
  "yolo-alternative"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Image Recognition",
]
authors = [
  { name = "sivanandan21", email = "sivapn721@gmail.com" }
]
dependencies = [
  "rfdetr[train,onnx,stream]>=1.12.0",
  "supervision>=0.25.0",
  "opencv-python-headless>=4.8.1.78",
  "onnxruntime>=1.19.0",
  "numpy>=1.26.0",
  "Pillow>=10.0.0",
  "pydantic>=2.7.0",
  "pyyaml>=6.0.1",
  "rich>=13.7.0",
  "typer>=0.12.0",
]

[project.scripts]
workzone = "cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
